# Local development stack. Production adds the api, worker and Caddy services in Phase 9.
#
#   docker compose --env-file .env -f deploy/compose.yml up -d
#   docker compose --env-file .env -f deploy/compose.yml down       # keeps the volume
#   docker compose --env-file .env -f deploy/compose.yml down -v    # destroys the data
#
# `--env-file .env` is not optional. Compose resolves a bare `.env` relative to the compose
# file's own directory (deploy/), not the repository root, so without it POSTGRES_PASSWORD from
# the root .env is silently ignored and the container initialises with the default below —
# which then will not match the password in DATABASE_URL.
#
# POSTGRES_PASSWORD only takes effect on first initialisation of the volume. Changing it later
# requires `down -v`, which destroys the data.
#
# ADR-001: Postgres runs here rather than on Supabase, which removes the IPv4 session-pooler
# workaround, the 500 MB free ceiling, the auto-generated Data API and the RLS deny-all second
# lock. Supabase is used for authentication only.

# An explicit project name, container name and volume name, so this stack can never share
# a container or a data volume with another project on the same machine.
name: outreach

services:
  postgres:
    image: postgres:17-alpine
    container_name: outreach-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outreach_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-outreach}
      # Deterministic collation, so ORDER BY does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # Bound to loopback only: never expose the database to the network.
      # 5433, never the default 5432: another project's Postgres may already hold that port,
      # and a wrong password is a terrible last line of defence against migrating the wrong
      # database. See ADR-005.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - outreach_pgdata:/var/lib/postgresql/data
    healthcheck:
      # The queue depends on the database being ready, not merely up.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outreach} -d ${POSTGRES_DB:-outreach}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # A throwaway database for the integration tests, so a test run can never touch dev data.
  # Tmpfs-backed and wiped on restart.
  postgres_test:
    image: postgres:17-alpine
    container_name: outreach-pg-test
    profiles: [test]
    environment:
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach_test
      POSTGRES_DB: outreach_test
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres -c fsync=off -c full_page_writes=off -c synchronous_commit=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach_test"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  outreach_pgdata:
