<!doctype html>
<html lang="en">
  <head>
    <title>Careers - Hooli</title>
  </head>
  <body>
    <!-- A board built out of web components. The host elements are in the light DOM; the
         controls and their labels are not, so a scan of the document finds a form with no
         questions at all. The scanner has to say so rather than report an empty form. -->
    <form>
      <hooli-field data-q="Full name"></hooli-field>
      <hooli-field data-q="Email"></hooli-field>
      <hooli-field data-q="Tell us about a project you are proud of"></hooli-field>
      <button type="submit">Apply</button>
    </form>
  </body>
</html>
