name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI never holds real SMTP, IMAP or LLM credentials. Tests use fakes and
# @example.com addresses, and SEND_MODE stays at its `disabled` default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, types and tests
    runs-on: ubuntu-latest

    # The integration tests exercise FOR UPDATE SKIP LOCKED, a partial unique index, a unique
    # constraint under concurrency and an append-only trigger. Those are database behaviour, so
    # they need a real Postgres.
    #
    # Deliberately NOT a service container: pulling postgres from Docker Hub hits the
    # unauthenticated rate limit on shared runners, which fails the build for reasons that have
    # nothing to do with the code. The runner image already ships PostgreSQL, so we start that.
    #
    # Port 5432 here, unlike locally. ADR-005 chose to verify the database's identity rather
    # than its port precisely because CI and production legitimately differ — and an ephemeral
    # runner has no neighbouring project to collide with.
    env:
      DATABASE_URL: postgresql+asyncpg://outreach:outreach_ci@127.0.0.1:5432/outreach

    steps:
      - uses: actions/checkout@v7

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          pg_isready --timeout=30
          # SUPERUSER so the integration harness can CREATE DATABASE for its own test database.
          sudo -u postgres psql -c \
            "CREATE USER outreach WITH PASSWORD 'outreach_ci' SUPERUSER CREATEDB;"
          sudo -u postgres psql -c "CREATE DATABASE outreach OWNER outreach;"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  frontend:
    name: frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm test
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  deploy-artifacts:
    name: image and deploy config
    runs-on: ubuntu-latest
    # The production image and the Compose file are only exercised on the VM otherwise, which
    # means a broken Dockerfile is discovered during a deploy — the worst moment to find out.
    # Nothing here is pushed anywhere; the image is built and thrown away.
    steps:
      - uses: actions/checkout@v7

      # The default docker driver cannot export a build cache, so `cache-to: type=gha` fails
      # outright without this: buildx has to run on the container driver.
      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: outreach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image can import the app and run alembic
        run: |
          docker run --rm outreach:ci python -c 'import app.api.app, app.worker.main'
          docker run --rm outreach:ci alembic --version
          # Non-root, because both processes parse bytes chosen by somebody else.
          test "$(docker run --rm outreach:ci id -un)" = outreach

      - name: The configuration check runs inside the image
        env:
          # Fake values, shaped like real ones. The check prints variable NAMES only.
          GROQ_API_KEY: gsk_ci_placeholder_value_1234567890
          SMTP_EMAIL: sender@example.com
          SMTP_PASSWORD: not-a-real-password
        run: |
          docker run --rm -e GROQ_API_KEY -e SMTP_EMAIL -e SMTP_PASSWORD             outreach:ci python -m app.scripts.check_env

      - name: The Compose files are valid
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-password
          API_DOMAIN: api.example.com
        run: |
          docker compose -f deploy/compose.yml config --quiet
          docker compose -f deploy/compose.prod.yml config --quiet

      - name: The deploy scripts parse
        run: |
          bash -n deploy/deploy.sh
          bash -n deploy/backup.sh
          # `set -euo pipefail` is what makes a half-finished deploy stop rather than continue.
          grep -q 'set -euo pipefail' deploy/deploy.sh
          grep -q 'set -euo pipefail' deploy/backup.sh
          # deploy.sh must never be able to start sending or destroy the data volume.
          # Comments are stripped first: both strings appear there on purpose, saying that the
          # script does not do these things, and a check that cannot tell a comment from code
          # would force the explanation out of the file to keep itself green.
          code() { sed -e 's/[[:space:]]*#.*$//' "$1"; }
          ! code deploy/deploy.sh | grep -q 'SEND_MODE='
          ! code deploy/deploy.sh | grep -q 'down -v'

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action lists the pull request's commits to scan only what the PR adds.
      # Without this it gets a 403 and fails before scanning anything.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks scans history, not just the diff

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
