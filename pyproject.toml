[project]
name = "outreach-automation"
version = "0.1.0"
description = "Cold-outreach system: research, draft, human review, scheduled send, reply handling."
requires-python = "==3.12.*"

# Pinned to exact versions. The prototype used `>=` throughout with no lockfile, so two
# installs a week apart were different programs (issue E6). `uv.lock` pins the full graph.
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "pydantic==2.14.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "openpyxl==3.1.5",
    "aiosmtplib==5.1.3",
    "tenacity==9.2.1",
    # LangChain, LangGraph, Rich and aiosqlite went with the prototype in Phase 7. Nothing in
    # `app/` imports them: the workflow is an explicit state machine over a Postgres job queue,
    # logs are structured JSON on stdout (`app/core/logging.py`), and the database is Postgres.
    # They are listed here only as a note, because an image that still carried four unused
    # dependency trees would carry their vulnerabilities too (§19).
    "sqlalchemy[asyncio]==2.1.4",
    "asyncpg==0.32.0",
    "alembic==1.20.0",
    # Windows ships no tz database, and scheduling is defined in Asia/Kolkata, so ZoneInfo
    # needs this. Also required by Alembic's UTC filename timestamps.
    "tzdata==2026.5",
    # RFC-compliant address syntax. Deliverability (MX) is checked separately through an
    # injectable resolver, so no test ever needs the network.
    "email-validator==2.3.0",
    "dnspython==2.9.0",
    # Used directly rather than a vendor SDK: every provider in the chain speaks the same
    # OpenAI-compatible endpoint, and we need control over error classification (issue E5).
    "httpx==0.28.1",
    # Local JWT verification against Supabase JWKS (ARCHITECTURE_TARGET.md §14). The crypto
    # extra brings the RSA/EC backends needed for asymmetric signing keys.
    #
    # 2.15.0 at the earliest. Everything below it carries GHSA-42vr-xj54-vc7v, an unauthenticated
    # RecursionError in the *pre-verification* payload parse that
    # `PyJWKClient.get_signing_key_from_jwt` performs — which is precisely the call
    # `app/api/security.py` makes on every request, before any signature has been checked. The
    # same release also fixes OKP key-identity confusion (GHSA-x33g-cr3x-6449) and an
    # options-dict mutation that could silently skip claim verification on a reused dict.
    "pyjwt[crypto]==2.15.0",
    # Main-content extraction: strips nav, footers and boilerplate, so the evidence budget is
    # spent on prose rather than menus.
    "trafilatura==2.3.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "aiosmtpd==1.4.6",       # in-process fake SMTP; no test may touch the network
    "ruff==0.17.0",
    "mypy==2.4.0",
    "types-openpyxl==3.1.5.20260827",
    "respx==0.23.1",
    # Property-based tests for the scheduling maths: §22 asks for them there specifically,
    # because window edges, weekends and warm-up are where hand-picked examples miss cases.
    "hypothesis==6.169.0",
]

[tool.uv]
package = false

# ──────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

# ──────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "frontend", "app/db/migrations"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "ASYNC",    # async correctness
    "S",        # bandit security checks
    "DTZ",      # naive datetime use — we store timestamptz in UTC
    "RUF",
]
ignore = [
    "B008",     # FastAPI's Depends()/File() defaults are the documented idiom
    "S101",     # assert is how tests assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]

# ──────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
# Strict where the rewrite lives; the legacy modules are excluded until they are replaced.
files = ["app"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# aiosmtpd is the in-process fake SMTP server used by the tests and ships no type hints.
# The langchain and langgraph entries went with those dependencies in Phase 9.
module = ["aiosmtpd.*"]
ignore_missing_imports = true
